
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina Kitchen AR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      overflow-x: hidden;
    }
    .font-outfit {
      font-family: 'Outfit', sans-serif;
    }
    .glass-morphism {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .ar-border {
      position: relative;
    }
    .ar-border::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      border: 2px solid rgba(56, 189, 248, 0.5);
      clip-path: polygon(0 0, 20% 0, 20% 10%, 0% 10%, 0% 0%, 0% 0%, 10% 0%, 10% 20%, 0% 20%, 0% 10%, 0% 10%, 0% 100%, 0% 80%, 10% 80%, 10% 90%, 0% 90%, 0% 100%, 20% 100%, 20% 90%, 0% 90%, 0% 100%, 100% 100%, 100% 80%, 90% 80%, 90% 90%, 100% 90%, 100% 100%, 80% 100%, 80% 90%, 100% 90%, 100% 100%, 100% 0%, 100% 20%, 90% 20%, 90% 10%, 100% 10%, 100% 0%, 80% 0%, 80% 10%, 100% 10%, 100% 0%);
      pointer-events: none;
    }
    .scanline {
      width: 100%;
      height: 2px;
      background: linear-gradient(to right, transparent, #38bdf8, transparent);
      position: absolute;
      animation: scan 3s linear infinite;
      z-index: 10;
    }
    @keyframes scan {
      0% { top: 0; }
      100% { top: 100%; }
    }
    .gradient-text {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
